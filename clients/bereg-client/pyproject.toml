[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bereg-client"
version = "0.1.0"
description = "Async/sync Python client for the bereg.ua (Magento 1) shop catalogue."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gleam", email = "gleaming_bamboo@hotmail.com" }]
keywords = ["bereg", "bereg.ua", "magento", "scraper", "html", "fishing", "lures", "catalog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[project.scripts]
bereg = "bereg.cli:main"

[project.urls]
Homepage = "https://github.com/gleamingbamboo/bereg-client"
Repository = "https://github.com/gleamingbamboo/bereg-client"
Issues = "https://github.com/gleamingbamboo/bereg-client/issues"
Changelog = "https://github.com/gleamingbamboo/bereg-client/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bereg"]

[tool.hatch.build.targets.sdist]
include = ["src/bereg", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bereg"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "soupsieve", "soupsieve.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["bereg"]
branch = true