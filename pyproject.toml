[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lures"
version = "0.1.0"
description = "Агрегатор приманок (воблери) з flagman.ua, ibis-gear.com та bereg.ua -> SQLite + Streamlit + Excel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gleam", email = "gleaming_bamboo@hotmail.com" }]
keywords = ["fishing", "lures", "wobblers", "scraper", "streamlit", "sqlite", "excel", "flagman", "ibis-gear", "bereg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database :: Front-Ends",
  "Typing :: Typed",
]
dependencies = [
  "bereg-client>=0.1.0",
  "flagman-client>=0.1.0",
  "ibisgear-client>=0.1.0",
  "loguru>=0.7.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0.1",
  "sqlalchemy>=2.1.4",
  "streamlit>=1.40",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
lures-import = "lures.cli:import_app"
lures-export = "lures.cli:export_app"
lures-serve = "lures.cli:serve_app"

[project.urls]
Repository = "https://github.com/gleamingbamboo/lures"
Issues = "https://github.com/gleamingbamboo/lures/issues"

# Local path-editable sources while the client libraries live in this workspace.
# Once the repositories are public, switch to git+https://...@v0.1.0 (or PyPI).
[tool.uv.sources]
bereg-client = { path = "clients/bereg-client" }
flagman-client = { path = "clients/flagman-client" }
ibisgear-client = { path = "clients/ibisgear-client" }

[tool.hatch.build.targets.wheel]
packages = ["src/lures"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "W"]
# Український контент навмисний: кирилиця в рядках/докстрінгах — не помилка.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/lures/ui.py" = ["RUF001", "RUF002", "RUF003"]
"tests/*" = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lures"]
warn_unreachable = true

# Клієнт-бібліотеки покладаються на не типізовані bs4/lxml (bereg-client),
# а також на бібліотеки без офіційних стабів (openpyxl/yaml/pandas).
[[tool.mypy.overrides]]
module = [
    "bs4",
    "bs4.*",
    "soupsieve",
    "soupsieve.*",
    "lxml",
    "lxml.*",
    "openpyxl",
    "openpyxl.*",
    "yaml",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["lures"]
branch = true
