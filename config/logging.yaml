# Конфігурація логування (loguru)
# Перевизначення через змінні середовища:
#   LURES_LOG_DIR — папка для лог-файлів (за замовчуванням: logs/)
#   LURES_LOG_LEVEL_CONSOLE — рівень для консолі (INFO)
#   LURES_LOG_LEVEL_FILE — рівень для файлу (DEBUG)

console:
  enabled: true
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  colorize: true

file:
  enabled: true
  dir: "logs"
  level: "DEBUG"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  rotation: "1 day"
  retention: "30 days"
  compression: "zip"
  serialize: false

# Перехоплення стандартного logging (sqlalchemy, uvicorn, тощо)
intercept_standard_logging: true
intercept_level: "DEBUG"